# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: jotter

before:
  hooks:
    - go mod tidy

builds:
  # Split darwin/linux into separate ids so the quill post-hook only runs on
  # the darwin build — quill errors on non-Mach-O input, and a single combined
  # build would run the hook against the linux ELF too.
  - id: jotter-darwin
    main: ./
    binary: jotter
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags: &ldflags
      - -s -w
      - -X github.com/sebjacobs/jotter/cmd.version={{.Version}}
      - -X github.com/sebjacobs/jotter/cmd.commit={{.FullCommit}}
      - -X github.com/sebjacobs/jotter/cmd.date={{.Date}}
    # Sign + notarize each darwin binary in place, right after it's built and
    # before archiving, so the signed binary is what ends up in the tarball.
    # quill (anchore/quill) signs and notarizes Mach-O binaries from the Linux
    # release runner — no macOS/codesign needed. This is the post-hook form
    # rather than a binary_signs block on purpose: signs/binary_signs register
    # a separate signature artifact that GoReleaser then tries to upload, but
    # quill signs in place and writes no such file, so the publish step fails.
    # quill reads QUILL_SIGN_* / QUILL_NOTARY_* from the inherited process
    # environment (the release workflow's job env, from repo secrets); snapshots
    # run --ad-hoc + --dry-run and need none of them.
    hooks:
      post:
        - cmd: quill sign-and-notarize "{{ .Path }}" --dry-run={{ .IsSnapshot }} --ad-hoc={{ .IsSnapshot }} -vv
  - id: jotter-linux
    main: ./
    binary: jotter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: *ldflags

archives:
  - formats: [tar.gz]
    name_template: "jotter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  header: |
    See [CHANGELOG.md](https://github.com/sebjacobs/jotter/blob/main/CHANGELOG.md) for the full list of changes.

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

homebrew_casks:
  - name: jotter
    binaries: [jotter]
    # Stopgap until the binary is signed + notarized: Homebrew casks quarantine
    # downloaded binaries by default, so jotter gets a com.apple.quarantine attr
    # on install/upgrade and Gatekeeper blocks first run. Strip it post-install.
    hooks:
      post:
        install: |
          if OS.mac? && File.exist?("#{staged_path}/jotter")
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/jotter"]
          end
    repository:
      owner: sebjacobs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/sebjacobs/jotter"
    description: "Append-only, git-backed log for Claude Code sessions"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "jotter: bump to {{ .Tag }}"
    generate_completions_from_executable:
      executable: "jotter"
      args:
        - completion
      base_name: "jotter"
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    caveats: |
      Run `jotter setup` once to wire jotter into Claude Code —
      it configures the data dir, installs the session skills, and
      grants the Bash(jotter:*) permission.
